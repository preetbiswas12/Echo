name: Build release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-release:
    name: Build release APK (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            artifact: echo-release-apk-arm64
          - abi: x86_64
            artifact: echo-release-apk-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Create CI google-services.json
        shell: bash
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "echo-ci-placeholder",
              "storage_bucket": "echo-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "com.echo" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "CI_PLACEHOLDER_KEY" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000001",
                  "android_client_info": { "package_name": "com.echo.debug" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "CI_PLACEHOLDER_KEY" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000002",
                  "android_client_info": { "package_name": "com.echo.nightly" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "CI_PLACEHOLDER_KEY" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build release APK (${{ matrix.abi }})
        # Lightest single APK: en-only resources on top of the ABI filter.
        run: ./gradlew :app:assembleGenericRelease --stacktrace -Pci.disableAbiSplits=true -Pci.abiFilters=${{ matrix.abi }} -Pci.locales=en

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: app/build/outputs/apk/generic/release/*.apk
          if-no-files-found: error
