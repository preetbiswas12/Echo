name: Build debug APK

on:
  push:
  workflow_dispatch:

jobs:
  build-debug:
    name: Build ${{ matrix.build-type }} APK (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            artifact: echo-debug-apk-arm64
            build-type: Debug
            extra-props: ''
          - abi: x86_64
            artifact: echo-debug-apk-x86_64
            build-type: Debug
            extra-props: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build ${{ matrix.build-type }} APK (${{ matrix.abi }})
        run: ./gradlew :app:assembleGeneric${{ matrix.build-type }} --stacktrace -Pci.disableAbiSplits=true -Pci.abiFilters=${{ matrix.abi }} ${{ matrix.extra-props }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: app/build/outputs/apk/generic/${{ matrix.build-type == 'Debug' && 'debug' || 'release' }}/*.apk
          if-no-files-found: error
